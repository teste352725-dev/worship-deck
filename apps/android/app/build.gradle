plugins { id "com.android.application" }

android {
    namespace "br.com.worshipdeck.mobile"
    compileSdk 35

    defaultConfig {
        applicationId "br.com.worshipdeck.mobile"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}
