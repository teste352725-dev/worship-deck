plugins { id "com.android.application" }

android {
    namespace "br.com.worshipdeck.mobile"
    compileSdk 35

    defaultConfig {
        applicationId "br.com.worshipdeck.mobile"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "1.0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    packaging { resources { excludes += ["/META-INF/{AL2.0,LGPL2.1}"] } }
}
